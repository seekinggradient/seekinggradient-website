<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1850" viewBox="0 0 1200 1850" role="img" aria-labelledby="title desc">
  <title id="title">Kimi K3 backbone schedule</title>
  <desc id="desc">A portrait diagram of Kimi K3's 93-layer decoder. It shows text and MoonViT-V2 inputs, 23 repetitions of three KDA layers followed by one Gated MLA layer through layer 92, a final Gated MLA layer at layer 93, one dense first feed-forward layer, and Stable LatentMoE in the remaining 92 layers.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#202020"/>
    </marker>
    <style>
      .title { font: 700 54px Helvetica, Arial, sans-serif; fill: #111; }
      .subtitle { font: 34px Helvetica, Arial, sans-serif; fill: #333; }
      .section { font: 700 38px Helvetica, Arial, sans-serif; fill: #111; }
      .body { font: 32px Helvetica, Arial, sans-serif; fill: #191919; }
      .strong { font: 700 32px Helvetica, Arial, sans-serif; fill: #111; }
      .box { fill: #fff; stroke: #202020; stroke-width: 4; }
      .soft { fill: #e8e8e8; stroke: #202020; stroke-width: 4; }
      .dark { fill: #292929; stroke: #111; stroke-width: 4; }
      .white { fill: #fff; }
      .line { fill: none; stroke: #202020; stroke-width: 5; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1200" height="1850" fill="#f2f2f2"/>
  <rect x="38" y="38" width="1124" height="1774" rx="30" fill="#fafafa" stroke="#111" stroke-width="5"/>

  <text x="90" y="120" class="title">Kimi K3 backbone schedule</text>
  <text x="90" y="176" class="subtitle">Two independent schedules run through one 93-layer decoder.</text>

  <rect x="90" y="235" width="440" height="150" rx="22" class="box"/>
  <text x="310" y="290" text-anchor="middle" class="section">TEXT</text>
  <text x="310" y="343" text-anchor="middle" class="body">Token embeddings</text>

  <rect x="670" y="235" width="440" height="150" rx="22" class="box"/>
  <text x="890" y="290" text-anchor="middle" class="section">VISION</text>
  <text x="890" y="343" text-anchor="middle" class="body">MoonViT-V2 + projector</text>

  <path d="M310 385 L310 445 L570 445" class="line"/>
  <path d="M890 385 L890 445 L630 445" class="line"/>

  <rect x="120" y="470" width="960" height="160" rx="24" class="dark"/>
  <text x="600" y="525" text-anchor="middle" class="section white">SHARED DECODER BACKBONE</text>
  <text x="600" y="574" text-anchor="middle" class="body white">93 layers · width 7,168 · 96 attention heads</text>

  <path d="M600 630 L600 690" class="line"/>

  <rect x="90" y="710" width="1020" height="220" rx="24" class="box"/>
  <rect x="90" y="710" width="1020" height="62" rx="24" class="soft"/>
  <rect x="90" y="744" width="1020" height="28" fill="#e8e8e8"/>
  <text x="125" y="754" class="strong">LAYER 1</text>
  <text x="125" y="826" class="section">KDA token mixing</text>
  <text x="125" y="882" class="body">Dense SiTU-GLU feed-forward — the one dense exception</text>

  <path d="M600 930 L600 982" class="line"/>

  <rect x="90" y="1000" width="1020" height="210" rx="24" class="box"/>
  <text x="125" y="1058" class="strong">LAYERS 2–3</text>
  <text x="125" y="1112" class="section">KDA · KDA</text>
  <text x="125" y="1164" class="body">Stable LatentMoE in each layer</text>

  <path d="M600 1210 L600 1262" class="line"/>

  <rect x="90" y="1280" width="1020" height="210" rx="24" class="soft"/>
  <text x="125" y="1338" class="strong">LAYER 4</text>
  <text x="125" y="1392" class="section">Gated MLA — global token retrieval</text>
  <text x="125" y="1444" class="body">Stable LatentMoE</text>

  <rect x="150" y="1525" width="900" height="92" rx="20" fill="#fff" stroke="#555" stroke-width="4" stroke-dasharray="12 10"/>
  <text x="600" y="1582" text-anchor="middle" class="body">Layers 5–92: repeat 22 more 3 KDA + 1 MLA cycles</text>

  <path d="M600 1617 L600 1650" class="line"/>

  <rect x="90" y="1665" width="1020" height="70" rx="20" class="dark"/>
  <text x="600" y="1711" text-anchor="middle" class="strong white">Layer 93: final Gated MLA + Stable LatentMoE</text>

  <text x="600" y="1780" text-anchor="middle" class="strong">Totals: 69 KDA · 24 MLA · 1 dense FFN · 92 MoE</text>
</svg>
