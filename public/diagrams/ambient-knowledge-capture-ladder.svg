<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="740" viewBox="0 0 1400 740" role="img" aria-labelledby="title desc">
<title id="title">The capture fidelity ladder</title>
<desc id="desc">For the frontmost window an arbiter picks the highest available text source — DOM, then accessibility text, then screen OCR — and normalizes all of them into one capture event.</desc>
<style>
  .bg{fill:#f6f2ea}.panel{fill:#fffaf0;stroke:#d9d2bf;stroke-width:2}.core{fill:#1a1a1a}.accent{fill:#b8542c}.soft{fill:#ede6d6}.line{stroke:#3b3a36;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
  .dash{stroke-dasharray:8 8}.t{font-family:Inter,Arial,sans-serif;fill:#1a1a1a}.h{font-family:Georgia,serif;font-size:36px}.m{font-size:19px;font-weight:700}.s{font-size:15px;fill:#3b3a36}.mono{font-family:monospace;font-size:13px;fill:#6b6862}.white{fill:#fffaf0}
</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#3b3a36"/></marker></defs>
<rect class="bg" width="1400" height="740"/>
<text x="70" y="72" class="t h">Capture is a fidelity ladder</text>
<text x="72" y="105" class="t s">The browser extension and the whole-screen observer are not rivals — they are two rungs of one ladder, arbitrated per window.</text>

<rect x="70" y="290" width="230" height="120" rx="22" class="soft"/>
<text x="105" y="342" class="t m">Frontmost</text>
<text x="105" y="372" class="t s">window / selection</text>

<rect x="360" y="290" width="220" height="120" rx="22" class="core"/>
<text x="398" y="338" class="t m white">Arbiter</text>
<text x="398" y="368" class="t s white">pick highest rung</text>

<rect x="640" y="150" width="440" height="108" rx="20" class="panel"/>
<rect x="640" y="150" width="10" height="108" rx="0" class="accent"/>
<text x="672" y="192" class="t m">DOM · browser extension</text>
<text x="672" y="222" class="t s">Clean article text, canonical URL, precise anchor</text>
<rect x="990" y="170" width="72" height="30" rx="15" class="accent"/><text x="1000" y="190" class="t s white">highest</text>

<rect x="640" y="296" width="440" height="108" rx="20" class="panel"/>
<text x="672" y="338" class="t m">AX · accessibility text</text>
<text x="672" y="368" class="t s">Native apps, real text, no OCR needed</text>

<rect x="640" y="442" width="440" height="108" rx="20" class="panel"/>
<text x="672" y="484" class="t m">OCR · ScreenCaptureKit + Vision</text>
<text x="672" y="514" class="t s">Everything AX-blind: Electron, canvas, image-PDF</text>

<rect x="1150" y="296" width="190" height="108" rx="22" class="core"/>
<text x="1180" y="342" class="t s white">One normalized</text>
<text x="1180" y="368" class="t s white">event → store</text>

<path class="line" d="M300 350 C325 350 335 350 360 350"/>
<path class="line" d="M580 340 C608 340 612 210 640 204"/>
<path class="line" d="M580 350 C610 350 612 350 640 350"/>
<path class="line" d="M580 360 C608 360 612 492 640 496"/>
<path class="line" d="M1080 204 C1110 204 1122 330 1150 340"/>
<path class="line" d="M1080 350 C1112 350 1122 350 1150 350"/>
<path class="line" d="M1080 496 C1110 496 1122 372 1150 362"/>

<text x="640" y="612" class="t s">Highest available rung wins; the lower rungs are suppressed for that same window, so nothing is captured twice.</text>
<text x="640" y="642" class="t mono">Highlight ⌘⇧H resolves the same ladder: DOM → AX → OCR crop, then attaches your note.</text>
</svg>
