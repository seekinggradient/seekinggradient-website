<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Personal publishing pipeline architecture</title>
  <desc id="desc">A system diagram showing a reading plan moving through source intake, curriculum planning, cited drafting, editorial checks, EPUB building, delivery adapters, and a personal e-reader shelf.</desc>
  <defs>
    <style>
      .ink { fill: #17152b; }
      .muted { fill: #625f6d; }
      .rule { stroke: #cfc6b8; stroke-width: 2; }
      .flow { stroke: #3154d8; stroke-width: 4; fill: none; marker-end: url(#arrow); }
      .loop { stroke: #ff7043; stroke-width: 3; fill: none; marker-end: url(#arrow-orange); stroke-dasharray: 9 8; }
      .label { font: 600 18px Inter, Arial, sans-serif; letter-spacing: 1.8px; }
      .title { font: 600 42px Georgia, serif; }
      .body { font: 400 19px Inter, Arial, sans-serif; }
      .small { font: 500 15px "Courier New", monospace; letter-spacing: 1px; }
      .number { font: 600 17px "Courier New", monospace; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3154d8"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ff7043"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#17152b" flood-opacity=".08"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="#f7f1e7"/>
  <circle cx="1470" cy="110" r="58" fill="#f8e45c"/>
  <path d="M 80 805 C 220 730, 300 880, 440 805" stroke="#ef67a7" stroke-width="22" fill="none" opacity=".8"/>

  <text x="80" y="82" class="label muted">RFC 0.1 · PERSONAL PRESS</text>
  <text x="80" y="137" class="title ink">From a learning goal to a book on the shelf.</text>
  <text x="80" y="178" class="body muted">The durable artifact is a cited EPUB edition—not a chat response and not an opaque model run.</text>

  <g filter="url(#shadow)">
    <rect x="70" y="250" width="202" height="280" rx="4" fill="#fffaf0" stroke="#cfc6b8" stroke-width="2"/>
    <rect x="292" y="250" width="202" height="280" rx="4" fill="#fffaf0" stroke="#cfc6b8" stroke-width="2"/>
    <rect x="514" y="250" width="202" height="280" rx="4" fill="#fffaf0" stroke="#cfc6b8" stroke-width="2"/>
    <rect x="736" y="250" width="202" height="280" rx="4" fill="#fffaf0" stroke="#cfc6b8" stroke-width="2"/>
    <rect x="958" y="250" width="202" height="280" rx="4" fill="#fffaf0" stroke="#cfc6b8" stroke-width="2"/>
    <rect x="1180" y="250" width="202" height="280" rx="4" fill="#fffaf0" stroke="#cfc6b8" stroke-width="2"/>
  </g>

  <g>
    <circle cx="112" cy="292" r="22" fill="#3154d8"/><text x="103" y="299" class="number" fill="#fffaf0">1</text>
    <text x="96" y="342" class="label ink">INTENT</text>
    <text x="96" y="382" class="body muted"><tspan x="96">Topic, level,</tspan><tspan x="96" dy="28">cadence, reading</tspan><tspan x="96" dy="28">time, source rules.</tspan></text>
    <rect x="96" y="470" width="86" height="9" fill="#f8e45c"/><rect x="96" y="489" width="134" height="9" fill="#d8ccff"/>
  </g>

  <g>
    <circle cx="334" cy="292" r="22" fill="#ff7043"/><text x="325" y="299" class="number" fill="#fffaf0">2</text>
    <text x="318" y="342" class="label ink">SOURCES</text>
    <text x="318" y="382" class="body muted"><tspan x="318">Uploads, papers,</tspan><tspan x="318" dy="28">feeds, the open web,</tspan><tspan x="318" dy="28">and rights metadata.</tspan></text>
    <rect x="318" y="463" width="148" height="45" fill="#ffddd1"/>
    <text x="331" y="491" class="small ink">SOURCE LEDGER</text>
  </g>

  <g>
    <circle cx="556" cy="292" r="22" fill="#ef67a7"/><text x="547" y="299" class="number" fill="#fffaf0">3</text>
    <text x="540" y="342" class="label ink">CURRICULUM</text>
    <text x="540" y="382" class="body muted"><tspan x="540">Outline, sequence,</tspan><tspan x="540" dy="28">prerequisites, and</tspan><tspan x="540" dy="28">persistent book state.</tspan></text>
    <path d="M548 470h145M548 490h110" class="rule"/><circle cx="680" cy="490" r="8" fill="#ef67a7"/>
  </g>

  <g>
    <circle cx="778" cy="292" r="22" fill="#3154d8"/><text x="769" y="299" class="number" fill="#fffaf0">4</text>
    <text x="762" y="342" class="label ink">DRAFT</text>
    <text x="762" y="382" class="body muted"><tspan x="762">Evidence-bound</tspan><tspan x="762" dy="28">prose, footnotes,</tspan><tspan x="762" dy="28">figures, glossary.</tspan></text>
    <path d="M762 469h130M762 489h95" class="rule"/>
    <text x="874" y="496" class="small" fill="#3154d8">[7]</text>
  </g>

  <g>
    <circle cx="1000" cy="292" r="22" fill="#8bd8bd"/><text x="991" y="299" class="number" fill="#17152b">5</text>
    <text x="984" y="342" class="label ink">EDITOR</text>
    <text x="984" y="382" class="body muted"><tspan x="984">Claims, citations,</tspan><tspan x="984" dy="28">contradictions, safety,</tspan><tspan x="984" dy="28">EPUB validation.</tspan></text>
    <circle cx="1000" cy="486" r="18" fill="#8bd8bd"/>
    <path d="M990 486l8 8 15-19" stroke="#17152b" stroke-width="4" fill="none"/>
  </g>

  <g>
    <circle cx="1222" cy="292" r="22" fill="#f8e45c"/><text x="1213" y="299" class="number" fill="#17152b">6</text>
    <text x="1206" y="342" class="label ink">DELIVER</text>
    <text x="1206" y="382" class="body muted"><tspan x="1206">Download, local relay,</tspan><tspan x="1206" dy="28">or approved personal</tspan><tspan x="1206" dy="28">document delivery.</tspan></text>
    <rect x="1241" y="463" width="57" height="42" rx="3" fill="none" stroke="#17152b" stroke-width="3"/>
    <path d="M1248 472h43M1250 495h39" class="rule"/>
  </g>

  <path d="M272 390h20" class="flow"/>
  <path d="M494 390h20" class="flow"/>
  <path d="M716 390h20" class="flow"/>
  <path d="M938 390h20" class="flow"/>
  <path d="M1160 390h20" class="flow"/>

  <g>
    <rect x="292" y="616" width="1016" height="136" rx="4" fill="#17152b"/>
    <text x="330" y="658" class="label" fill="#f8e45c">IMMUTABLE EDITIONS</text>
    <text x="330" y="700" class="body" fill="#fffaf0">Daily chapter</text>
    <text x="575" y="700" class="body" fill="#fffaf0">Weekly volume</text>
    <text x="820" y="700" class="body" fill="#fffaf0">Final book</text>
    <text x="1065" y="700" class="body" fill="#fffaf0">EPUB archive</text>
    <text x="330" y="728" class="small" fill="#bdb8c9">NO IN-PLACE APPEND · VERSION EVERY ARTIFACT · KEEP DOWNLOAD PORTABLE</text>
  </g>

  <path d="M1296 548 C 1440 584, 1440 720, 1314 742" class="loop"/>
  <text x="1370" y="638" class="small" fill="#ff7043" transform="rotate(90 1370 638)">DELIVERY RESULT</text>
</svg>
