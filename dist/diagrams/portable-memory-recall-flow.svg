<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
<title id="title">Portable memory recall flow</title>
<desc id="desc">A user prompt triggers workspace detection, retrieval, provenance filtering, context injection, and optional memory writeback.</desc>
<style>.bg{fill:#f6f2ea}.box{fill:#fffaf0;stroke:#d9d2bf;stroke-width:2}.dark{fill:#1a1a1a}.accent{fill:#b8542c}.line{stroke:#3b3a36;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.t{font-family:Inter,Arial,sans-serif;fill:#1a1a1a}.h{font-family:Georgia,serif;font-size:36px}.m{font-size:18px;font-weight:800}.s{font-size:14px;fill:#3b3a36}.w{fill:#fffaf0}</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#3b3a36"/></marker></defs>
<rect class="bg" width="1400" height="760"/>
<text x="70" y="70" class="t h">Memory plugin: read/write loop</text>
<text x="72" y="103" class="t s">The plugin is valuable if it makes remembering automatic but auditable.</text>
<rect x="80" y="170" width="190" height="110" rx="22" class="box"/><text x="112" y="215" class="t m">1. User prompt</text><text x="112" y="245" class="t s">inside Claude/Codex/etc.</text>
<rect x="330" y="170" width="210" height="110" rx="22" class="box"/><text x="365" y="215" class="t m">2. Detect scope</text><text x="365" y="245" class="t s">project, person, task</text>
<rect x="600" y="170" width="220" height="110" rx="22" class="box"/><text x="635" y="215" class="t m">3. Query memory</text><text x="635" y="245" class="t s">semantic + structured</text>
<rect x="880" y="170" width="235" height="110" rx="22" class="box"/><text x="915" y="215" class="t m">4. Filter evidence</text><text x="915" y="245" class="t s">provenance + confidence</text>
<rect x="1180" y="170" width="170" height="110" rx="22" class="dark"/><text x="1210" y="215" class="t m w">5. Inject</text><text x="1210" y="245" class="t s w">minimal context</text>
<path class="line" d="M270 225 L330 225"/><path class="line" d="M540 225 L600 225"/><path class="line" d="M820 225 L880 225"/><path class="line" d="M1115 225 L1180 225"/>

<rect x="330" y="425" width="260" height="115" rx="22" class="box"/><text x="365" y="470" class="t m">6. Agent acts</text><text x="365" y="500" class="t s">answer, code, plan, artifact</text>
<rect x="690" y="425" width="285" height="115" rx="22" class="box"/><text x="725" y="470" class="t m">7. Candidate memories</text><text x="725" y="500" class="t s">decisions, preferences, facts</text>
<rect x="1070" y="425" width="250" height="115" rx="22" class="box"/><text x="1105" y="470" class="t m">8. Writeback</text><text x="1105" y="500" class="t s">reviewable, deduped, scoped</text>
<path class="line" d="M1265 280 C1265 360 470 350 470 425"/><path class="line" d="M590 482 L690 482"/><path class="line" d="M975 482 L1070 482"/>
<text x="205" y="650" class="t s">Design principle: default to recall silently; ask before storing sensitive or broad personal facts; keep every memory traceable to a source.</text>
</svg>
