<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="700" viewBox="0 0 1400 700" role="img" aria-labelledby="title desc">
<title id="title">Privacy is the substrate</title>
<desc id="desc">On-screen content passes a privacy gate before it ever touches disk, is processed on-device into an encrypted store, and is captured in three escalating modes with always-visible controls.</desc>
<style>
  .bg{fill:#f6f2ea}.panel{fill:#fffaf0;stroke:#d9d2bf;stroke-width:2}.core{fill:#1a1a1a}.accent{fill:#b8542c}.soft{fill:#ede6d6}.line{stroke:#3b3a36;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
  .dash{stroke-dasharray:8 8}.t{font-family:Inter,Arial,sans-serif;fill:#1a1a1a}.h{font-family:Georgia,serif;font-size:36px}.m{font-size:19px;font-weight:700}.s{font-size:15px;fill:#3b3a36}.mono{font-family:monospace;font-size:13px;fill:#6b6862}.white{fill:#fffaf0}
</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#3b3a36"/></marker></defs>
<rect class="bg" width="1400" height="700"/>
<text x="70" y="72" class="t h">Privacy is the substrate, not a later pass</text>
<text x="72" y="105" class="t s">A capable capture tool dies on trust, not capability. Everything sensitive is denied before it can reach disk.</text>

<rect x="70" y="200" width="200" height="150" rx="22" class="soft"/>
<text x="102" y="270" class="t m">On-screen</text>
<text x="102" y="300" class="t s">content</text>

<rect x="330" y="175" width="360" height="200" rx="26" class="panel"/>
<rect x="330" y="175" width="10" height="200" rx="0" class="accent"/>
<text x="362" y="215" class="t m">Privacy gate</text>
<text x="362" y="252" class="t s">Secure-field skip (password inputs)</text>
<text x="362" y="284" class="t s">App / domain denylist</text>
<text x="362" y="316" class="t s">Private-browsing off</text>
<text x="362" y="348" class="t s">DLP scrub before disk</text>

<rect x="750" y="200" width="250" height="150" rx="26" class="core"/>
<text x="785" y="248" class="t m white">On-device</text>
<rect x="785" y="270" width="180" height="52" rx="14" fill="#fffaf0"/><text x="805" y="302" class="t s">Encrypted store</text>

<rect x="1060" y="200" width="270" height="150" rx="22" class="soft"/>
<text x="1092" y="262" class="t m">Distilling agent</text>
<text x="1092" y="294" class="t s">→ cited notes</text>

<path class="line" d="M270 275 C300 275 305 275 330 275"/>
<path class="line" d="M690 275 C715 275 725 275 750 275"/>
<path class="line" d="M1000 275 C1028 275 1032 275 1060 275"/>

<text x="70" y="440" class="t m">Three modes, escalating by consent</text>
<rect x="70" y="465" width="400" height="96" rx="20" class="panel"/>
<text x="98" y="505" class="t m">Base</text>
<text x="98" y="535" class="t s">Focus timeline only — no body text</text>
<rect x="500" y="465" width="400" height="96" rx="20" class="panel"/>
<text x="528" y="505" class="t m">Body</text>
<text x="528" y="535" class="t s">Captured on highlight or dwell</text>
<rect x="930" y="465" width="400" height="96" rx="20" class="panel"/>
<text x="958" y="505" class="t m">Passive OCR</text>
<text x="958" y="535" class="t s">Per-app opt-in, never default</text>

<text x="70" y="620" class="t mono">Always on: menu-bar indicator · one-click pause · retention / decay · granular delete · open-source core</text>
</svg>
