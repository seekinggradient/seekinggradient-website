<svg xmlns="http://www.w3.org/2000/svg" width="2752" height="1536" viewBox="0 0 2752 1536" role="img" aria-labelledby="title desc">
<title id="title">Again binary review network product mockup board</title>
<desc id="desc">Three interface mockups for a cross-category review network based on the question would you do it again.</desc>
<defs>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#1a1a1a" flood-opacity="0.17"/>
  </filter>
  <linearGradient id="warm" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#fffaf0"/>
    <stop offset="1" stop-color="#efe5d2"/>
  </linearGradient>
  <linearGradient id="yes" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#708767"/>
    <stop offset="1" stop-color="#2f5f5b"/>
  </linearGradient>
  <linearGradient id="no" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#b8542c"/>
    <stop offset="1" stop-color="#7a3829"/>
  </linearGradient>
</defs>
<style>
  .bg{fill:#f6f2ea}.screen{fill:#fffaf0;stroke:#d9d2bf;stroke-width:3;filter:url(#shadow)}.panel{fill:#fff;stroke:#d9d2bf;stroke-width:2}.chip{fill:#ede6d6}.dark{fill:#1a1a1a}.ink{fill:#1a1a1a}.soft{fill:#3b3a36}.mute{fill:#6b6862}.rule{stroke:#d9d2bf;stroke-width:2}.accent{fill:#b8542c}.green{fill:#708767}.teal{fill:#2f5f5b}.gold{fill:#d89c4a}.white{fill:#fffaf0}.t{font-family:Inter,Arial,sans-serif;fill:#1a1a1a}.serif{font-family:Georgia,serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.h{font-size:42px}.m{font-size:27px;font-weight:700}.s{font-size:22px}.xs{font-size:18px}.xxs{font-size:15px}.line{stroke:#3b3a36;stroke-width:4;fill:none;stroke-linecap:round}
</style>
<rect class="bg" width="2752" height="1536"/>

<text x="134" y="128" class="t mono xs mute">N° 008 / CONSUMER · REVIEWS</text>
<text x="134" y="204" class="t serif h ink">Again: binary reviews for experiences</text>
<text x="134" y="248" class="t s soft">A cross-category review network where the atomic rating is simply: would you do it again?</text>

<g transform="translate(150 330)">
  <rect width="740" height="1000" rx="38" class="screen"/>
  <rect x="38" y="36" width="664" height="74" rx="22" class="dark"/>
  <circle cx="82" cy="73" r="10" fill="#e9c9b5"/><circle cx="118" cy="73" r="10" fill="#708767"/><circle cx="154" cy="73" r="10" fill="#d9d2bf"/>
  <text x="68" y="160" class="t mono xxs mute">EXPERIENCE PAGE</text>
  <text x="68" y="214" class="t serif h ink">Would you do it again?</text>

  <rect x="68" y="260" width="604" height="220" rx="30" fill="url(#warm)" stroke="#d9d2bf" stroke-width="2"/>
  <rect x="104" y="300" width="132" height="132" rx="24" fill="#d8a24d"/>
  <rect x="126" y="330" width="88" height="58" rx="12" fill="#fffaf0"/>
  <rect x="140" y="392" width="60" height="14" rx="7" fill="#7a3829"/>
  <text x="270" y="324" class="t mono xxs mute">RESTAURANT</text>
  <text x="270" y="372" class="t m ink">Little Lantern</text>
  <text x="270" y="414" class="t xs mute">Mission · dinner · $$</text>
  <rect x="270" y="438" width="158" height="42" rx="21" class="chip"/>
  <text x="298" y="466" class="t xxs soft">87% again</text>

  <rect x="68" y="525" width="284" height="154" rx="28" fill="url(#yes)"/>
  <text x="154" y="586" class="t m white">YES</text>
  <text x="122" y="632" class="t xs white">I would go back</text>
  <rect x="388" y="525" width="284" height="154" rx="28" fill="url(#no)"/>
  <text x="484" y="586" class="t m white">NO</text>
  <text x="440" y="632" class="t xs white">Once was enough</text>

  <rect x="68" y="724" width="604" height="148" rx="26" class="panel"/>
  <text x="104" y="774" class="t m ink">Why?</text>
  <text x="104" y="816" class="t s soft">Great noodles, too loud for a work dinner.</text>
  <line x1="104" y1="848" x2="620" y2="848" class="rule"/>
  <text x="104" y="914" class="t mono xxs mute">OPTIONAL NOTE · PHOTOS · CONTEXT</text>
</g>

<g transform="translate(1006 330)">
  <rect width="740" height="1000" rx="38" class="screen"/>
  <rect x="38" y="36" width="664" height="74" rx="22" class="dark"/>
  <circle cx="82" cy="73" r="10" fill="#e9c9b5"/><circle cx="118" cy="73" r="10" fill="#708767"/><circle cx="154" cy="73" r="10" fill="#d9d2bf"/>
  <text x="68" y="160" class="t mono xxs mute">CROSS-CATEGORY SEARCH</text>
  <text x="68" y="214" class="t serif h ink">What is worth repeating?</text>

  <rect x="68" y="260" width="604" height="70" rx="26" class="panel"/>
  <text x="106" y="304" class="t s mute">date night things my friends would do again</text>

  <g transform="translate(68 382)">
    <rect width="604" height="138" rx="28" class="panel"/>
    <circle cx="62" cy="69" r="38" fill="#d8a24d"/>
    <text x="126" y="58" class="t m ink">Past Lives</text>
    <text x="126" y="94" class="t xs mute">movie · 21 friends voted</text>
    <text x="462" y="65" class="t m green">91%</text>
    <text x="438" y="96" class="t xxs mute">would rewatch</text>
  </g>
  <g transform="translate(68 552)">
    <rect width="604" height="138" rx="28" class="panel"/>
    <circle cx="62" cy="69" r="38" fill="#708767"/>
    <text x="126" y="58" class="t m ink">Point Reyes weekend</text>
    <text x="126" y="94" class="t xs mute">trip · 8 friends voted</text>
    <text x="462" y="65" class="t m green">75%</text>
    <text x="438" y="96" class="t xxs mute">would repeat</text>
  </g>
  <g transform="translate(68 722)">
    <rect width="604" height="138" rx="28" class="panel"/>
    <circle cx="62" cy="69" r="38" fill="#2f5f5b"/>
    <text x="126" y="58" class="t m ink">The Wayfarer Hotel</text>
    <text x="126" y="94" class="t xs mute">hotel · 44 travelers voted</text>
    <text x="462" y="65" class="t m accent">38%</text>
    <text x="438" y="96" class="t xxs mute">would stay again</text>
  </g>
  <rect x="68" y="904" width="186" height="52" rx="18" class="chip"/>
  <text x="104" y="938" class="t xxs soft">restaurants</text>
  <rect x="270" y="904" width="134" height="52" rx="18" class="chip"/>
  <text x="310" y="938" class="t xxs soft">movies</text>
  <rect x="420" y="904" width="162" height="52" rx="18" class="chip"/>
  <text x="458" y="938" class="t xxs soft">travel</text>
</g>

<g transform="translate(1862 330)">
  <rect width="740" height="1000" rx="38" class="screen"/>
  <rect x="38" y="36" width="664" height="74" rx="22" class="dark"/>
  <circle cx="82" cy="73" r="10" fill="#e9c9b5"/><circle cx="118" cy="73" r="10" fill="#708767"/><circle cx="154" cy="73" r="10" fill="#d9d2bf"/>
  <text x="68" y="160" class="t mono xxs mute">PERSONAL TASTE GRAPH</text>
  <text x="68" y="214" class="t serif h ink">Your again list</text>

  <rect x="68" y="260" width="604" height="180" rx="30" class="dark"/>
  <text x="108" y="326" class="t m white">This month</text>
  <text x="108" y="380" class="t s white">18 experiences logged · 12 would do again</text>
  <rect x="108" y="404" width="420" height="18" rx="9" fill="#ede6d6"/>
  <rect x="108" y="404" width="280" height="18" rx="9" fill="#708767"/>

  <g transform="translate(68 500)">
    <rect width="282" height="178" rx="28" class="panel"/>
    <text x="34" y="54" class="t mono xxs mute">YES</text>
    <text x="34" y="98" class="t m ink">Would do again</text>
    <text x="34" y="136" class="t xs mute">Repeatable places and lists.</text>
  </g>
  <g transform="translate(390 500)">
    <rect width="282" height="178" rx="28" class="panel"/>
    <text x="34" y="54" class="t mono xxs mute">NO</text>
    <text x="34" y="98" class="t m ink">Once was enough</text>
    <text x="34" y="136" class="t xs mute">Useful memory and warning.</text>
  </g>

  <rect x="68" y="728" width="604" height="192" rx="30" fill="url(#warm)" stroke="#d9d2bf" stroke-width="2"/>
  <text x="108" y="784" class="t m ink">Ask the network</text>
  <text x="108" y="828" class="t s soft">"Sushi in SF people like me would go back to."</text>
  <path d="M108 870 C170 824 234 922 302 870 C368 818 432 922 496 870 C540 836 584 850 622 884" class="line"/>
  <circle cx="144" cy="858" r="12" class="green"/>
  <circle cx="286" cy="882" r="12" class="gold"/>
  <circle cx="438" cy="868" r="12" class="teal"/>
  <circle cx="590" cy="882" r="12" class="accent"/>
</g>
</svg>
