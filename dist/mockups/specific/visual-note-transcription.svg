<svg xmlns="http://www.w3.org/2000/svg" width="2752" height="1536" viewBox="0 0 2752 1536" role="img" aria-labelledby="title desc">
<title id="title">Visual note transcription product mockup board</title>
<desc id="desc">Three interface mockups for a visual transcription pipeline: upload and patch detection, patch review, and final Markdown output.</desc>
<defs>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#1a1a1a" flood-opacity="0.18"/>
  </filter>
  <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#fffaf0"/>
    <stop offset="1" stop-color="#f2ead9"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#b8542c"/>
    <stop offset="1" stop-color="#6f7f67"/>
  </linearGradient>
</defs>
<style>
  .bg{fill:#f6f2ea}.ink{fill:#1a1a1a}.soft{fill:#3b3a36}.mute{fill:#6b6862}.rule{stroke:#d9d2bf;stroke-width:3}.screen{fill:#fffaf0;stroke:#d9d2bf;stroke-width:3;filter:url(#shadow)}.panel{fill:#fff;stroke:#d9d2bf;stroke-width:2}.chip{fill:#ede6d6}.accent{fill:#b8542c}.green{fill:#6f7f67}.dark{fill:#1a1a1a}.line{stroke:#3b3a36;stroke-width:4;fill:none;stroke-linecap:round}.dash{stroke-dasharray:12 14}.t{font-family:Inter,Arial,sans-serif;fill:#1a1a1a}.serif{font-family:Georgia,serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.h{font-size:42px}.m{font-size:27px;font-weight:700}.s{font-size:23px}.xs{font-size:18px}.xxs{font-size:15px}.white{fill:#fffaf0}.hand{font-family:Bradley Hand,Comic Sans MS,cursive;font-weight:700}
</style>
<rect class="bg" width="2752" height="1536"/>
<circle cx="180" cy="170" r="3" fill="#d9d2bf"/><circle cx="350" cy="170" r="3" fill="#d9d2bf"/><circle cx="520" cy="170" r="3" fill="#d9d2bf"/><circle cx="690" cy="170" r="3" fill="#d9d2bf"/><circle cx="860" cy="170" r="3" fill="#d9d2bf"/><circle cx="1030" cy="170" r="3" fill="#d9d2bf"/><circle cx="1200" cy="170" r="3" fill="#d9d2bf"/><circle cx="1370" cy="170" r="3" fill="#d9d2bf"/><circle cx="1540" cy="170" r="3" fill="#d9d2bf"/><circle cx="1710" cy="170" r="3" fill="#d9d2bf"/><circle cx="1880" cy="170" r="3" fill="#d9d2bf"/><circle cx="2050" cy="170" r="3" fill="#d9d2bf"/><circle cx="2220" cy="170" r="3" fill="#d9d2bf"/><circle cx="2390" cy="170" r="3" fill="#d9d2bf"/>
<text x="134" y="128" class="t mono xs mute">N° 007 / AI TOOLS · DOCUMENT INTELLIGENCE</text>
<text x="134" y="204" class="t serif h ink">Visual transcription pipeline</text>
<text x="134" y="248" class="t s soft">From handwritten PDF to faithful Markdown, with patch review instead of one-shot OCR.</text>

<g transform="translate(150 330)">
  <rect width="740" height="1000" rx="38" class="screen"/>
  <rect x="38" y="36" width="664" height="74" rx="22" class="dark"/>
  <circle cx="82" cy="73" r="10" fill="#e9c9b5"/><circle cx="118" cy="73" r="10" fill="#6f7f67"/><circle cx="154" cy="73" r="10" fill="#d9d2bf"/>
  <text x="68" y="160" class="t mono xxs mute">STEP 01</text>
  <text x="68" y="214" class="t serif h ink">Upload + detect</text>
  <rect x="68" y="260" width="604" height="382" rx="26" fill="url(#paper)" stroke="#d9d2bf" stroke-width="2"/>
  <text x="116" y="326" class="t hand m ink">May 24, 2026 - Sunday</text>
  <text x="116" y="400" class="t hand s ink">Brainstorming on architecture</text>
  <circle cx="132" cy="486" r="7" class="ink"/><text x="162" y="496" class="t hand s ink">Research</text>
  <path d="M162 548 L380 548" class="line"/><path d="M162 602 L520 602" class="line"/>
  <circle cx="132" cy="662" r="7" class="ink"/><text x="162" y="672" class="t hand s ink">PFS MCP</text>
  <path d="M465 456 C560 462 604 520 594 604" class="line dash"/>
  <rect x="430" y="492" width="156" height="90" rx="18" fill="#fff" stroke="#b8542c" stroke-width="4"/>
  <text x="458" y="545" class="t mono xxs accent">PATCH 7</text>
  <rect x="68" y="690" width="604" height="86" rx="18" class="chip"/>
  <text x="100" y="744" class="t s soft">18 regions found across 3 pages</text>
  <g transform="translate(68 820)">
    <rect width="140" height="112" rx="18" class="panel"/><text x="32" y="66" class="t mono xs mute">TITLE</text>
    <rect x="160" width="140" height="112" rx="18" class="panel"/><text x="194" y="66" class="t mono xs mute">BODY</text>
    <rect x="320" width="140" height="112" rx="18" class="panel"/><text x="350" y="66" class="t mono xs mute">MARGIN</text>
    <rect x="480" width="124" height="112" rx="18" class="panel"/><text x="512" y="66" class="t mono xs mute">FLOW</text>
  </g>
</g>

<g transform="translate(1006 330)">
  <rect width="740" height="1000" rx="38" class="screen"/>
  <rect x="38" y="36" width="664" height="74" rx="22" class="dark"/>
  <circle cx="82" cy="73" r="10" fill="#e9c9b5"/><circle cx="118" cy="73" r="10" fill="#6f7f67"/><circle cx="154" cy="73" r="10" fill="#d9d2bf"/>
  <text x="68" y="160" class="t mono xxs mute">STEP 02</text>
  <text x="68" y="214" class="t serif h ink">Patch review</text>
  <rect x="68" y="260" width="300" height="410" rx="26" fill="url(#paper)" stroke="#d9d2bf" stroke-width="2"/>
  <text x="102" y="332" class="t hand m ink">Harness integration</text>
  <circle cx="118" cy="402" r="7" class="ink"/><text x="148" y="412" class="t hand s ink">Prompt library</text>
  <path d="M148 466 L324 466" class="line"/><path d="M148 520 L300 520" class="line"/>
  <text x="104" y="604" class="t hand s ink">nightly job?</text>
  <rect x="392" y="260" width="280" height="410" rx="26" class="panel"/>
  <text x="428" y="326" class="t mono xxs mute">MODEL READ</text>
  <text x="428" y="380" class="t m ink">Consolidation prompt:</text>
  <rect x="428" y="420" width="208" height="58" rx="16" fill="#fff2ea" stroke="#b8542c" stroke-width="2"/>
  <text x="454" y="458" class="t s accent">nightly job?</text>
  <text x="428" y="540" class="t xs mute">Confidence</text>
  <rect x="428" y="564" width="200" height="18" rx="9" class="chip"/><rect x="428" y="564" width="132" height="18" rx="9" class="green"/>
  <text x="428" y="628" class="t xs mute">Needs human approval</text>
  <rect x="68" y="728" width="604" height="168" rx="26" class="dark"/>
  <text x="106" y="784" class="t m white">Review queue</text>
  <text x="106" y="842" class="t s white">4 uncertain spans · 2 diagram labels · 1 low-confidence word</text>
</g>

<g transform="translate(1862 330)">
  <rect width="740" height="1000" rx="38" class="screen"/>
  <rect x="38" y="36" width="664" height="74" rx="22" class="dark"/>
  <circle cx="82" cy="73" r="10" fill="#e9c9b5"/><circle cx="118" cy="73" r="10" fill="#6f7f67"/><circle cx="154" cy="73" r="10" fill="#d9d2bf"/>
  <text x="68" y="160" class="t mono xxs mute">STEP 03</text>
  <text x="68" y="214" class="t serif h ink">Faithful Markdown</text>
  <rect x="68" y="260" width="604" height="620" rx="26" fill="#1a1a1a"/>
  <text x="112" y="326" class="t mono xs" fill="#d9d2bf"># May 24, 2026 - Sunday</text>
  <text x="112" y="386" class="t mono xs" fill="#fffaf0">## Brainstorming on Architecture</text>
  <text x="112" y="446" class="t mono xs" fill="#fffaf0">- Research</text>
  <text x="144" y="496" class="t mono xs" fill="#fffaf0">- What are the top stocks...</text>
  <text x="144" y="546" class="t mono xs" fill="#fffaf0">- Get a low down on news</text>
  <text x="112" y="626" class="t mono xs" fill="#fffaf0">## PFS MCP / Portable File System</text>
  <text x="112" y="686" class="t mono xs" fill="#fffaf0">- Simple CRUD operations...</text>
  <text x="112" y="746" class="t mono xs" fill="#fffaf0">```text</text>
  <text x="112" y="796" class="t mono xs" fill="#fffaf0">Query -> heuristic -> LLM</text>
  <rect x="68" y="918" width="180" height="58" rx="16" fill="url(#accent)"/>
  <text x="110" y="956" class="t xs white">Raw transcript</text>
  <rect x="270" y="918" width="172" height="58" rx="16" class="chip"/>
  <text x="310" y="956" class="t xs soft">Clean outline</text>
  <rect x="464" y="918" width="208" height="58" rx="16" class="chip"/>
  <text x="494" y="956" class="t xs soft">Source-linked archive</text>
</g>
</svg>
